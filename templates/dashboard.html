<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Converge Studio — htmldrop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8fafc; --surface: #fff; --border: #e2e8f0;
      --text: #1e293b; --muted: #64748b; --accent: #3b82f6;
      --accent-soft: #eff6ff; --danger: #ef4444; --success: #10b981;
      --insight-bg: #fefce8; --insight-border: #fbbf24;
      --debate-bg: #fef2f2; --debate-border: #f87171;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; margin-bottom: 24px; border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header h1 span { color: var(--accent); }
    .file-select {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; background: var(--surface); cursor: pointer;
    }
    .stats {
      display: flex; gap: 16px; margin-bottom: 24px;
    }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px 20px; flex: 1;
    }
    .stat-value { font-size: 24px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .segment {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 16px; overflow: hidden;
    }
    .segment-header {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .segment-title { font-size: 14px; font-weight: 600; }
    .segment-badge {
      font-size: 11px; padding: 3px 8px; border-radius: 99px;
      font-weight: 500;
    }
    .badge-debate { background: var(--debate-bg); color: var(--danger); border: 1px solid var(--debate-border); }
    .badge-consensus { background: #ecfdf5; color: var(--success); border: 1px solid #6ee7b7; }
    .comments { padding: 16px 20px; }
    .comment {
      padding: 10px 14px; margin-bottom: 8px;
      background: var(--bg); border-radius: 8px; border: 1px solid var(--border);
    }
    .comment-meta {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--muted); margin-bottom: 4px;
    }
    .comment-author { font-weight: 600; color: var(--text); }
    .comment-text { font-size: 13px; }
    .comment-anchor {
      font-size: 11px; color: var(--accent); margin-top: 4px;
      font-style: italic;
    }
    .insight-panel {
      margin: 0 20px 16px; padding: 16px;
      background: var(--insight-bg); border: 1px solid var(--insight-border);
      border-radius: 8px;
    }
    .insight-header {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600; color: #92400e; margin-bottom: 8px;
    }
    .insight-content { font-size: 13px; line-height: 1.6; }
    .insight-content li { margin-bottom: 6px; }
    .insight-source {
      font-size: 11px; color: var(--muted); margin-top: 4px;
    }
    .insight-loading {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--muted);
    }
    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .segment-actions {
      padding: 12px 20px; border-top: 1px solid var(--border);
      display: flex; gap: 8px;
    }
    .btn {
      padding: 7px 14px; border-radius: 6px; font-size: 12px;
      font-weight: 500; cursor: pointer; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .btn-primary:hover { background: #2563eb; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .references {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px; margin-bottom: 16px;
    }
    .references h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .ref-list { list-style: none; }
    .ref-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border);
    }
    .ref-item:last-child { border-bottom: none; }
    .ref-remove { color: var(--danger); cursor: pointer; font-size: 16px; }
    .ref-add {
      display: flex; gap: 8px; margin-top: 8px;
    }
    .ref-add input {
      flex: 1; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px;
    }
    .converge-all {
      text-align: center; padding: 24px;
    }
    .converge-all .btn-primary { font-size: 14px; padding: 12px 32px; }
    .empty-state {
      text-align: center; padding: 80px 20px; color: var(--muted);
    }
    .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
    .setup-panel, .home-panel {
      max-width: 400px; margin: 80px auto; padding: 32px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; text-align: center;
    }
    .setup-panel h2 { margin-bottom: 8px; }
    .setup-panel p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .setup-panel input {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; margin-bottom: 12px;
    }
    .converge-result {
      margin: 0 20px 16px; padding: 16px;
      background: #ecfdf5; border: 1px solid #6ee7b7; border-radius: 8px;
    }
    .converge-result h4 { font-size: 12px; font-weight: 600; color: #065f46; margin-bottom: 8px; }
    .converge-result pre {
      font-size: 12px; white-space: pre-wrap; word-break: break-word;
      max-height: 200px; overflow-y: auto;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .settings-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 24px; margin-bottom: 24px;
    }
    .settings-panel h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    .setting-row {
      margin-bottom: 16px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .setting-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .setting-desc { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .setting-input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; font-family: monospace;
    }
    .setting-saved {
      display: inline-block; font-size: 11px; color: var(--success);
      margin-left: 8px; opacity: 0; transition: opacity 0.3s;
    }
    .setting-saved.show { opacity: 1; }
    .btn-icon {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--muted);
      transition: all 0.15s;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { border-color: var(--danger); color: var(--danger); }
    .key-status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 4px 10px; border-radius: 99px;
    }
    .key-status.active { background: #ecfdf5; color: var(--success); }
    .key-status.missing { background: var(--insight-bg); color: #92400e; }
    /* Doc viewer layout */
    .doc-viewer {
      display: flex; gap: 0; height: calc(100vh - 80px);
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      background: var(--surface);
    }
    .doc-iframe-wrap {
      flex: 1; border-right: 1px solid var(--border); position: relative;
    }
    .doc-iframe-wrap iframe {
      width: 100%; height: 100%; border: none;
    }
    .doc-margin {
      width: 340px; overflow-y: auto; padding: 16px;
      background: var(--bg);
    }
    .doc-margin-header {
      font-size: 13px; font-weight: 600; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .doc-margin-count {
      font-size: 11px; color: var(--muted); font-weight: 400;
      background: var(--surface); padding: 2px 8px; border-radius: 99px;
      border: 1px solid var(--border);
    }
    .mc {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; margin-bottom: 10px;
      transition: border-color 0.15s;
    }
    .mc:hover { border-color: var(--accent); }
    .mc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .mc-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
    }
    .mc-name { font-weight: 600; font-size: 12px; }
    .mc-time { font-size: 11px; color: var(--muted); margin-left: auto; }
    .mc-text { font-size: 13px; color: var(--text); line-height: 1.4; }
    .mc-anchor {
      margin-top: 6px; padding: 4px 8px;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 4px; font-size: 11px; display: inline-block;
    }
    .mc-insight {
      background: var(--insight-bg); border: 1px solid var(--insight-border);
      border-radius: 8px; padding: 12px; margin-bottom: 10px;
    }
    .mc-insight-header { font-size: 11px; font-weight: 600; color: #92400e; margin-bottom: 6px; }
    .mc-insight-text { font-size: 12px; line-height: 1.5; }
    .mc-insight-source { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .mc-actions { display: flex; gap: 6px; margin-top: 12px; }
    .doc-url-bar {
      padding: 8px 16px; background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    .doc-url-bar code {
      background: var(--surface); padding: 2px 8px;
      border-radius: 4px; border: 1px solid var(--border);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="app"></div>
  </div>
  <script>
  (function() {
    const app = document.getElementById('app');
    const DEFAULT_WORKER_URL = 'https://htmldrop-feedback.htmldrop.workers.dev';

    let state = {
      workerUrl: DEFAULT_WORKER_URL,
      authorKey: '',
      anthropicKey: '',
      currentDocId: '',
      page: 'home',
      files: [],
      selectedFile: null,
      feedback: [],
      segments: [],
      references: [],
      insights: {},
      showSettings: false,
    };

    function init() {
      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash);
      if (params.get('key')) state.authorKey = params.get('key');
      if (params.get('worker')) state.workerUrl = params.get('worker');
      if (params.get('doc')) state.currentDocId = params.get('doc');

      // Author key: localStorage (low-value identity token, persists across sessions)
      const savedAuthorKey = localStorage.getItem('htmldrop_author_key');
      if (savedAuthorKey && !state.authorKey) state.authorKey = savedAuthorKey;
      if (state.authorKey) localStorage.setItem('htmldrop_author_key', state.authorKey);

      // Anthropic key: sessionStorage only (payment credential, auto-clears on browser close)
      const savedAnthropicKey = sessionStorage.getItem('htmldrop_anthropic_key');
      if (savedAnthropicKey) state.anthropicKey = savedAnthropicKey;

      // If we have a docId, load feedback directly (no auth needed for reading)
      if (state.currentDocId) {
        loadFeedback(state.currentDocId);
      } else if (state.authorKey) {
        loadFiles();
      } else {
        state.page = 'home';
        renderHome();
      }
    }

    function renderHome() {
      const frag = document.createDocumentFragment();
      frag.appendChild(renderNav());

      const hero = document.createElement('div');
      hero.className = 'empty-state';
      const h2 = document.createElement('h2');
      h2.textContent = 'Converge Studio';
      const p1 = document.createElement('p');
      p1.textContent = 'AI-facilitated document feedback and synthesis.';
      p1.style.marginBottom = '24px';
      hero.append(h2, p1);

      // Direct doc ID input
      const docRow = document.createElement('div');
      docRow.style.cssText = 'display:flex;gap:8px;max-width:400px;margin:0 auto 16px;';
      const docInput = document.createElement('input');
      docInput.className = 'setting-input';
      docInput.placeholder = 'Enter a document ID to view feedback';
      docInput.style.margin = '0';
      const goBtn = document.createElement('button');
      goBtn.className = 'btn btn-primary';
      goBtn.textContent = 'View';
      goBtn.addEventListener('click', () => {
        if (docInput.value.trim()) {
          state.currentDocId = docInput.value.trim();
          window.location.hash = 'doc=' + state.currentDocId;
          loadFeedback(state.currentDocId);
        }
      });
      docRow.append(docInput, goBtn);
      hero.appendChild(docRow);

      const hint = document.createElement('p');
      hint.style.cssText = 'font-size:12px;color:var(--muted);margin-top:12px;';
      hint.textContent = 'Or connect your author key in Settings to see all your documents.';
      hero.appendChild(hint);

      frag.appendChild(hero);
      app.replaceChildren(frag);
    }

    function renderNav() {
      const nav = document.createElement('header');
      const h1 = document.createElement('h1');
      h1.textContent = 'Converge ';
      const span = document.createElement('span');
      span.textContent = 'Studio';
      h1.appendChild(span);
      h1.style.cursor = 'pointer';
      h1.addEventListener('click', () => { state.page = 'home'; renderHome(); });

      const actions = document.createElement('div');
      actions.className = 'header-actions';

      const keyStatus = document.createElement('span');
      keyStatus.className = 'key-status ' + (state.anthropicKey ? 'active' : 'missing');
      keyStatus.textContent = state.anthropicKey ? 'AI Ready' : 'No AI Key';

      const settingsBtn = document.createElement('button');
      settingsBtn.className = 'btn-icon';
      settingsBtn.textContent = '⚙ Settings';
      settingsBtn.addEventListener('click', () => { state.page = 'settings'; renderSettingsPage(); });

      actions.append(keyStatus, settingsBtn);

      if (state.authorKey) {
        const logoutBtn = document.createElement('button');
        logoutBtn.className = 'btn-icon btn-danger';
        logoutBtn.textContent = 'Logout';
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('htmldrop_author_key');
          sessionStorage.removeItem('htmldrop_anthropic_key');
          state.authorKey = '';
          state.anthropicKey = '';
          window.location.hash = '';
          renderHome();
        });
        actions.appendChild(logoutBtn);
      }

      nav.append(h1, actions);
      return nav;
    }

    function renderSettingsPage() {
      const frag = document.createDocumentFragment();
      frag.appendChild(renderNav());
      frag.appendChild(renderSettings());
      app.replaceChildren(frag);
    }

    async function loadFiles() {
      renderLoading('Loading your files...');
      try {
        const res = await fetch(state.workerUrl + '/api/author/files', {
          headers: { 'Authorization': 'Bearer ' + state.authorKey },
        });
        if (!res.ok) throw new Error('Failed to load files');
        const data = await res.json();
        state.files = data.files || [];
        if (state.files.length > 0) {
          state.selectedFile = state.files[0];
          await loadFeedback(state.selectedFile.docId);
        } else {
          renderEmpty();
        }
      } catch (e) {
        renderEmpty();
      }
    }

    async function loadFeedback(docId) {
      renderLoading('Loading feedback...');
      try {
        const res = await fetch(state.workerUrl + '/api/feedback/' + docId);
        const data = await res.json();
        state.feedback = data.items || [];
        state.currentDocId = docId;
        state.selectedFile = state.selectedFile || { docId, name: docId.slice(0, 8) };
        await loadSegments(docId);
      } catch (e) {
        state.feedback = [];
        renderDashboard();
      }
    }

    async function loadSegments(docId) {
      if (state.authorKey) {
        try {
          const res = await fetch(state.workerUrl + '/api/segments/' + docId, {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + state.authorKey,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ items: state.feedback }),
          });
          if (res.ok) {
            const data = await res.json();
            state.segments = data.segments || [];
            renderDashboard();
            return;
          }
        } catch (e) { /* fall through to client-side */ }
      }
      state.segments = fallbackSegmentation(state.feedback);
      renderDashboard();
    }

    function fallbackSegmentation(items) {
      const groups = {};
      for (const item of items) {
        const key = item.anchor?.selectedText?.slice(0, 40) || item.anchor?.selector || 'page-level';
        if (!groups[key]) groups[key] = { title: key, items: [], hasDebate: false };
        groups[key].items.push(item);
      }
      for (const seg of Object.values(groups)) {
        if (seg.items.length >= 2) {
          const authors = new Set(seg.items.map(i => i.author?.displayName));
          seg.hasDebate = authors.size >= 2;
        }
      }
      return Object.values(groups);
    }

    function renderLoading(msg) {
      const div = document.createElement('div');
      div.className = 'empty-state';
      const spin = document.createElement('div');
      spin.className = 'spinner';
      spin.style.margin = '0 auto 12px';
      const text = document.createElement('p');
      text.textContent = msg;
      div.append(spin, text);
      app.replaceChildren(div);
    }

    function renderEmpty() {
      const div = document.createElement('div');
      div.className = 'empty-state';
      const h2 = document.createElement('h2');
      h2.textContent = 'No feedback files yet';
      const p = document.createElement('p');
      p.textContent = 'Push a file with --feedback flag to get started: htmldrop push spec.html --feedback';
      div.append(h2, p);
      app.replaceChildren(div);
    }

    function renderDashboard() {
      const frag = document.createDocumentFragment();
      frag.appendChild(renderNav());

      // Container goes full width for the doc viewer
      const container = app.parentElement;
      container.style.maxWidth = '100%';
      container.style.padding = '0 16px';

      // Doc viewer: iframe left + comments right
      const viewer = document.createElement('div');
      viewer.className = 'doc-viewer';

      // Left: iframe with the published HTML
      const iframeWrap = document.createElement('div');
      iframeWrap.className = 'doc-iframe-wrap';

      const urlBar = document.createElement('div');
      urlBar.className = 'doc-url-bar';
      const urlLabel = document.createElement('span');
      urlLabel.textContent = 'Document: ';
      const urlCode = document.createElement('code');
      urlCode.textContent = state.currentDocId || state.selectedFile?.docId || 'unknown';
      urlBar.append(urlLabel, urlCode);

      if (state.files.length > 1) {
        const select = document.createElement('select');
        select.className = 'file-select';
        select.style.marginLeft = 'auto';
        for (const f of state.files) {
          const opt = document.createElement('option');
          opt.value = f.docId;
          opt.textContent = f.name || f.docId.slice(0, 8);
          if (f.docId === (state.selectedFile?.docId || state.currentDocId)) opt.selected = true;
          select.appendChild(opt);
        }
        select.addEventListener('change', (e) => {
          state.selectedFile = state.files.find(f => f.docId === e.target.value);
          state.currentDocId = e.target.value;
          loadFeedback(state.currentDocId);
        });
        urlBar.appendChild(select);
      }

      const iframe = document.createElement('iframe');
      iframe.sandbox = 'allow-same-origin';
      // Build a preview of the HTML content with highlighted comments
      const previewHtml = buildPreviewHtml();
      iframe.srcdoc = previewHtml;

      iframeWrap.append(urlBar, iframe);

      // Right: margin comments
      const margin = document.createElement('div');
      margin.className = 'doc-margin';

      const marginHeader = document.createElement('div');
      marginHeader.className = 'doc-margin-header';
      const marginTitle = document.createElement('span');
      marginTitle.textContent = 'Comments';
      const marginCount = document.createElement('span');
      marginCount.className = 'doc-margin-count';
      marginCount.textContent = state.feedback.length + ' total';
      marginHeader.append(marginTitle, marginCount);
      margin.appendChild(marginHeader);

      // Render comments grouped by segment
      if (state.segments.length > 0) {
        state.segments.forEach((seg, segIdx) => {
          // Segment label
          const segLabel = document.createElement('div');
          segLabel.style.cssText = 'font-size:11px;font-weight:600;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.5px;';
          segLabel.textContent = seg.title.length > 30 ? seg.title.slice(0, 30) + '...' : seg.title;
          if (seg.hasDebate) {
            const badge = document.createElement('span');
            badge.style.cssText = 'margin-left:6px;background:var(--debate-bg);color:var(--danger);padding:1px 6px;border-radius:99px;font-size:10px;';
            badge.textContent = 'debate';
            segLabel.appendChild(badge);
          }
          margin.appendChild(segLabel);

          // Comments in segment
          seg.items.forEach(item => {
            margin.appendChild(renderMarginComment(item));
          });

          // Insight (if exists)
          if (state.insights[segIdx] && !state.insights[segIdx].loading) {
            margin.appendChild(renderMarginInsight(state.insights[segIdx]));
          }

          // Actions for this segment
          const actions = document.createElement('div');
          actions.className = 'mc-actions';
          const insightBtn = document.createElement('button');
          insightBtn.className = 'btn';
          insightBtn.textContent = state.insights[segIdx] ? '↻ Refresh' : '⚡ Get Insights';
          insightBtn.style.fontSize = '11px';
          insightBtn.addEventListener('click', () => getInsights(segIdx));
          const convBtn = document.createElement('button');
          convBtn.className = 'btn btn-primary';
          convBtn.textContent = 'Converge';
          convBtn.style.fontSize = '11px';
          convBtn.addEventListener('click', () => convergeSegment(segIdx));
          actions.append(insightBtn, convBtn);
          margin.appendChild(actions);
        });
      } else {
        state.feedback.forEach(item => {
          margin.appendChild(renderMarginComment(item));
        });
      }

      // Converge All button at bottom
      if (state.feedback.length > 0) {
        const convAll = document.createElement('div');
        convAll.style.cssText = 'margin-top:16px;padding-top:16px;border-top:1px solid var(--border);';
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary';
        btn.style.width = '100%';
        btn.textContent = 'Converge All';
        btn.addEventListener('click', () => convergeAll());
        convAll.appendChild(btn);
        margin.appendChild(convAll);
      }

      viewer.append(iframeWrap, margin);
      frag.appendChild(viewer);
      app.replaceChildren(frag);
    }

    function renderMarginComment(item) {
      const card = document.createElement('div');
      card.className = 'mc';
      const header = document.createElement('div');
      header.className = 'mc-header';
      const avatar = document.createElement('div');
      avatar.className = 'mc-avatar';
      avatar.textContent = (item.author?.displayName || 'A')[0].toUpperCase();
      const name = document.createElement('span');
      name.className = 'mc-name';
      name.textContent = item.author?.displayName || 'Anonymous';
      const time = document.createElement('span');
      time.className = 'mc-time';
      time.textContent = formatTime(item.createdAt);
      header.append(avatar, name, time);
      const text = document.createElement('div');
      text.className = 'mc-text';
      text.textContent = item.content?.text || '';
      card.append(header, text);
      if (item.anchor?.selectedText) {
        const anchor = document.createElement('div');
        anchor.className = 'mc-anchor';
        anchor.textContent = '"' + item.anchor.selectedText.slice(0, 60) + '"';
        card.appendChild(anchor);
      }
      return card;
    }

    function renderMarginInsight(insight) {
      const panel = document.createElement('div');
      panel.className = 'mc-insight';
      const header = document.createElement('div');
      header.className = 'mc-insight-header';
      header.textContent = '⚡ AI Insight';
      panel.appendChild(header);
      if (insight.points) {
        insight.points.forEach(p => {
          const text = document.createElement('div');
          text.className = 'mc-insight-text';
          text.textContent = p.text;
          panel.appendChild(text);
          if (p.source) {
            const src = document.createElement('div');
            src.className = 'mc-insight-source';
            src.textContent = 'Source: ' + p.source;
            panel.appendChild(src);
          }
        });
      }
      return panel;
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return 'now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      return d.toLocaleDateString();
    }

    function buildPreviewHtml() {
      // Build a simple rendered view with highlighted anchors
      const anchors = state.feedback
        .filter(f => f.anchor?.selectedText)
        .map(f => f.anchor.selectedText);

      let html = '<!DOCTYPE html><html><head><style>body{font-family:-apple-system,sans-serif;padding:32px 48px;line-height:1.7;max-width:700px;color:#1e293b;}mark.hd-hl{background:#fef9c3;border-bottom:2px solid #fbbf24;border-radius:2px;padding:0 2px;}</style></head><body>';
      html += '<h2 style="margin-bottom:16px;">Document Preview</h2>';

      if (state.feedback.length === 0) {
        html += '<p style="color:#64748b;">No feedback yet for this document.</p>';
      } else {
        html += '<p style="color:#64748b;font-size:13px;margin-bottom:24px;">Highlighted text has reviewer comments attached.</p>';
        // Show unique anchors as content blocks
        const seen = new Set();
        state.feedback.forEach(item => {
          const txt = item.anchor?.selectedText;
          if (txt && !seen.has(txt)) {
            seen.add(txt);
            const escaped = txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            html += '<p><mark class="hd-hl">' + escaped + '</mark></p>';
          }
        });
        // Page-level comments
        const pageLevel = state.feedback.filter(f => f.anchor?.type === 'page_level');
        if (pageLevel.length > 0) {
          html += '<hr style="margin:24px 0;border:none;border-top:1px solid #e2e8f0;">';
          html += '<p style="color:#64748b;font-size:12px;">Page-level feedback (' + pageLevel.length + ' comments)</p>';
        }
      }
      html += '</body></html>';
      return html;
    }

    function renderSettings() {
      const panel = document.createElement('div');
      panel.className = 'settings-panel';
      const h3 = document.createElement('h3');
      h3.textContent = 'Settings';
      panel.appendChild(h3);

      // Anthropic API Key
      const aiRow = document.createElement('div');
      aiRow.className = 'setting-row';
      const aiLabel = document.createElement('div');
      aiLabel.className = 'setting-label';
      aiLabel.textContent = 'Anthropic API Key (for AI Insights & Converge)';
      const aiDesc = document.createElement('div');
      aiDesc.className = 'setting-desc';
      aiDesc.textContent = 'Stored in session memory only — automatically cleared when you close the browser. Never persisted to disk or sent to our servers.';
      const aiInput = document.createElement('input');
      aiInput.className = 'setting-input';
      aiInput.type = 'password';
      aiInput.placeholder = 'sk-ant-...';
      aiInput.value = state.anthropicKey || '';
      const aiSaved = document.createElement('span');
      aiSaved.className = 'setting-saved';
      aiSaved.textContent = 'Saved';
      aiInput.addEventListener('change', () => {
        state.anthropicKey = aiInput.value.trim();
        if (state.anthropicKey) {
          sessionStorage.setItem('htmldrop_anthropic_key', state.anthropicKey);
        } else {
          sessionStorage.removeItem('htmldrop_anthropic_key');
        }
        aiSaved.classList.add('show');
        setTimeout(() => aiSaved.classList.remove('show'), 2000);
        renderDashboard();
      });
      const aiAction = document.createElement('div');
      aiAction.style.marginTop = '8px';
      aiAction.style.fontSize = '12px';
      const aiLink = document.createElement('a');
      aiLink.href = 'https://console.anthropic.com/settings/keys';
      aiLink.target = '_blank';
      aiLink.textContent = 'Get an API key from Anthropic Console';
      aiLink.style.color = 'var(--accent)';
      aiAction.appendChild(aiLink);
      aiRow.append(aiLabel, aiDesc, aiInput, aiSaved, aiAction);
      panel.appendChild(aiRow);

      // Worker URL
      const workerRow = document.createElement('div');
      workerRow.className = 'setting-row';
      const wLabel = document.createElement('div');
      wLabel.className = 'setting-label';
      wLabel.textContent = 'Worker URL';
      const wDesc = document.createElement('div');
      wDesc.className = 'setting-desc';
      wDesc.textContent = 'The feedback relay backend. Change only if self-hosting.';
      const wInput = document.createElement('input');
      wInput.className = 'setting-input';
      wInput.type = 'url';
      wInput.value = state.workerUrl;
      wInput.addEventListener('change', () => {
        state.workerUrl = wInput.value.trim() || DEFAULT_WORKER_URL;
      });
      workerRow.append(wLabel, wDesc, wInput);
      panel.appendChild(workerRow);

      // Author key (read-only display)
      const authRow = document.createElement('div');
      authRow.className = 'setting-row';
      const authLabel = document.createElement('div');
      authLabel.className = 'setting-label';
      authLabel.textContent = 'Author Key';
      const authDesc = document.createElement('div');
      authDesc.className = 'setting-desc';
      authDesc.textContent = 'Your author identity. Generated by `htmldrop auth setup`.';
      const authValue = document.createElement('code');
      authValue.style.fontSize = '12px';
      authValue.style.color = 'var(--muted)';
      authValue.textContent = state.authorKey.slice(0, 8) + '...' + state.authorKey.slice(-4);
      authRow.append(authLabel, authDesc, authValue);
      panel.appendChild(authRow);

      return panel;
    }

    function renderReferences() {
      const div = document.createElement('div');
      div.className = 'references';
      const h3 = document.createElement('h3');
      h3.textContent = 'Reference URLs (AI will consult these for insights)';
      div.appendChild(h3);

      const list = document.createElement('ul');
      list.className = 'ref-list';
      for (let i = 0; i < state.references.length; i++) {
        const li = document.createElement('li');
        li.className = 'ref-item';
        const link = document.createElement('span');
        link.textContent = state.references[i];
        const rm = document.createElement('span');
        rm.className = 'ref-remove';
        rm.textContent = '×';
        rm.addEventListener('click', () => {
          state.references.splice(i, 1);
          renderDashboard();
        });
        li.append(link, rm);
        list.appendChild(li);
      }
      div.appendChild(list);

      const addRow = document.createElement('div');
      addRow.className = 'ref-add';
      const input = document.createElement('input');
      input.type = 'url';
      input.placeholder = 'https://example.com/reference-doc';
      const addBtn = document.createElement('button');
      addBtn.className = 'btn';
      addBtn.textContent = '+ Add';
      addBtn.addEventListener('click', () => {
        if (input.value.trim()) {
          state.references.push(input.value.trim());
          renderDashboard();
        }
      });
      addRow.append(input, addBtn);
      div.appendChild(addRow);
      return div;
    }

    function renderSegment(seg, idx) {
      const div = document.createElement('div');
      div.className = 'segment';

      // Header
      const header = document.createElement('div');
      header.className = 'segment-header';
      const title = document.createElement('span');
      title.className = 'segment-title';
      title.textContent = seg.title.length > 60 ? seg.title.slice(0, 60) + '...' : seg.title;
      header.appendChild(title);
      if (seg.hasDebate) {
        const badge = document.createElement('span');
        badge.className = 'segment-badge badge-debate';
        badge.textContent = 'Debate';
        header.appendChild(badge);
      } else if (seg.items.length >= 2) {
        const badge = document.createElement('span');
        badge.className = 'segment-badge badge-consensus';
        badge.textContent = 'Consensus';
        header.appendChild(badge);
      }
      div.appendChild(header);

      // Comments
      const comments = document.createElement('div');
      comments.className = 'comments';
      for (const item of seg.items) {
        const comment = document.createElement('div');
        comment.className = 'comment';
        const meta = document.createElement('div');
        meta.className = 'comment-meta';
        const author = document.createElement('span');
        author.className = 'comment-author';
        author.textContent = item.author?.displayName || 'Anonymous';
        const time = document.createElement('span');
        time.textContent = new Date(item.createdAt).toLocaleDateString();
        meta.append(author, time);
        const text = document.createElement('div');
        text.className = 'comment-text';
        text.textContent = item.content?.text || '';
        comment.append(meta, text);
        if (item.anchor?.selectedText) {
          const anchor = document.createElement('div');
          anchor.className = 'comment-anchor';
          anchor.textContent = '“' + item.anchor.selectedText.slice(0, 80) + '”';
          comment.appendChild(anchor);
        }
        comments.appendChild(comment);
      }
      div.appendChild(comments);

      // Insight panel (if exists)
      if (state.insights[idx]) {
        div.appendChild(renderInsight(state.insights[idx]));
      }

      // Actions
      const actions = document.createElement('div');
      actions.className = 'segment-actions';
      const insightBtn = document.createElement('button');
      insightBtn.className = 'btn';
      insightBtn.textContent = state.insights[idx] ? 'Refresh Insights' : 'Get Insights';
      insightBtn.addEventListener('click', () => getInsights(idx));
      const convergeBtn = document.createElement('button');
      convergeBtn.className = 'btn btn-primary';
      convergeBtn.textContent = 'Converge this segment';
      convergeBtn.addEventListener('click', () => convergeSegment(idx));
      actions.append(insightBtn, convergeBtn);
      div.appendChild(actions);

      return div;
    }

    function renderInsight(insight) {
      const panel = document.createElement('div');
      panel.className = 'insight-panel';
      const header = document.createElement('div');
      header.className = 'insight-header';
      header.textContent = '⚡ AI Insight';
      panel.appendChild(header);
      const content = document.createElement('div');
      content.className = 'insight-content';
      if (insight.loading) {
        const loading = document.createElement('div');
        loading.className = 'insight-loading';
        const spin = document.createElement('div');
        spin.className = 'spinner';
        const text = document.createElement('span');
        text.textContent = 'Researching...';
        loading.append(spin, text);
        content.appendChild(loading);
      } else if (insight.points) {
        const ul = document.createElement('ul');
        for (const point of insight.points) {
          const li = document.createElement('li');
          li.textContent = point.text;
          if (point.source) {
            const src = document.createElement('div');
            src.className = 'insight-source';
            src.textContent = 'Source: ' + point.source;
            li.appendChild(src);
          }
          ul.appendChild(li);
        }
        content.appendChild(ul);
      }
      panel.appendChild(content);
      return panel;
    }

    async function getInsights(segIdx) {
      if (!state.anthropicKey) {
        alert('Add your Anthropic API key in Settings to use AI features.');
        state.page = 'settings';
        renderSettingsPage();
        return;
      }
      state.insights[segIdx] = { loading: true };
      renderDashboard();

      try {
        const seg = state.segments[segIdx];
        const res = await fetch(state.workerUrl + '/api/insights/' + state.selectedFile.docId, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + state.authorKey,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            segment: seg,
            references: state.references,
            anthropicKey: state.anthropicKey,
          }),
        });
        if (res.ok) {
          const data = await res.json();
          state.insights[segIdx] = data;
        } else {
          state.insights[segIdx] = { points: [{ text: 'Could not generate insights. Check Worker deployment.' }] };
        }
      } catch (e) {
        state.insights[segIdx] = { points: [{ text: 'Network error — is the Worker deployed?' }] };
      }
      renderDashboard();
    }

    async function convergeSegment(segIdx) {
      if (!state.anthropicKey) {
        alert('Add your Anthropic API key in Settings to use AI features.');
        state.page = 'settings';
        renderSettingsPage();
        return;
      }
      const seg = state.segments[segIdx];
      const insight = state.insights[segIdx];
      try {
        const res = await fetch(state.workerUrl + '/api/converge/' + state.selectedFile.docId, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + state.authorKey,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            segment: seg,
            insight: insight,
            references: state.references,
            anthropicKey: state.anthropicKey,
          }),
        });
        if (res.ok) {
          const data = await res.json();
          alert('Segment converged. Suggestion: ' + (data.suggestion || '').slice(0, 200));
        }
      } catch (e) {
        alert('Failed to converge segment');
      }
    }

    async function convergeAll() {
      alert('Converging all segments... This will call the AI for each debated segment.');
      for (let i = 0; i < state.segments.length; i++) {
        if (state.segments[i].hasDebate || state.segments[i].items.length >= 2) {
          if (!state.insights[i]) await getInsights(i);
          await convergeSegment(i);
        }
      }
    }

    init();
  })();
  </script>
</body>
</html>
