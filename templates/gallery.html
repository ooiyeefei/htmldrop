<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SUBDOMAIN}} — htmldrop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #f8f9fa;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e2e8f0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1a1a2e;
    }

    header p {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .grid {
      display: grid;
      gap: 0.75rem;
    }

    .card {
      display: block;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      border-color: #3b82f6;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-weight: 500;
      font-size: 0.95rem;
      color: #1e293b;
    }

    .lock-icon {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .card-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #94a3b8;
    }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem 0.75rem;
      }

      .card {
        padding: 0.875rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>{{SUBDOMAIN}}</h1>
      <p>Shared HTML files</p>
      <div class="stats">
        <span>{{FILE_COUNT}} files</span>
        <span>Updated {{LAST_UPDATED}}</span>
      </div>
    </header>

    <div class="grid">
      {{FILE_CARDS}}
    </div>

    <div class="empty" style="display:{{EMPTY_DISPLAY}}">
      No files published yet. Push one with <code>htmldrop push file.html</code>
    </div>

    <footer>
      Powered by <a href="https://github.com/ooiyeefei/htmldrop" style="color: #64748b;">htmldrop</a> &amp; <a href="https://surge.sh" style="color: #64748b;">Surge</a>
    </footer>
  </div>
</body>
</html>
