name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-uat-node-${{ matrix.node }}
          path: |
            .scratch/m1-uat/run-*/*.png
            .scratch/m1-uat/run-*/*-failure.json
            .scratch/m2-uat/run-*/*.png
            .scratch/m2-uat/run-*/*-failure.json
            .scratch/m2-uat/run-*/browser-final.json
            .scratch/m2-uat/run-*/hosted-network.json
            .scratch/m2-uat/run-*/mermaid-save-response.json
          if-no-files-found: ignore
          retention-days: 7
      - run: npm pack --dry-run
